<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <defs>
    <linearGradient id="cov-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a8"/>
      <stop offset="100%" stop-color="#4eaf7b"/>
    </linearGradient>
    <filter id="cov-shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5cc48c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="216" y="9" width="68" height="68" rx="22" fill="#5cc48c" opacity="0.12"/>

  <!-- Brand Emblem (Centered at x=250) -->
  <rect x="223" y="16" width="54" height="54" rx="16" fill="url(#cov-grad-dark)" filter="url(#cov-shadow-dark)"/>
  <rect x="223" y="16" width="54" height="54" rx="16" stroke="#86efac" stroke-width="1.2" fill="none"/>
  
  <!-- Checkmark -->
  <path d="M236.5 43.5 L245.5 52.5 L263.5 34.5" stroke="#0e1210" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered Title -->
  <text x="250" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#e8eeea">Covenant</text>

  <!-- Centered Tagline -->
  <text x="250" y="128" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.2" fill="#96a39c">The model proposes, the contract disposes.</text>
</svg>
