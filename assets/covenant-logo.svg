<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <defs>
    <linearGradient id="cov-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c43"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <filter id="cov-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f5132" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="216" y="9" width="68" height="68" rx="22" fill="#0f5132" opacity="0.08"/>

  <!-- Brand Emblem (Centered at x=250) -->
  <rect x="223" y="16" width="54" height="54" rx="16" fill="url(#cov-grad-light)" filter="url(#cov-shadow-light)"/>
  <rect x="223" y="16" width="54" height="54" rx="16" stroke="#0a3622" stroke-width="1.2" fill="none"/>
  
  <!-- Checkmark -->
  <path d="M236.5 43.5 L245.5 52.5 L263.5 34.5" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered Title -->
  <text x="250" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#171f1b">Covenant</text>

  <!-- Centered Tagline -->
  <text x="250" y="128" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.2" fill="#626e67">The model proposes, the contract disposes.</text>
</svg>
